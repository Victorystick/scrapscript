# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
        # There is no go.sum to key the cache on, and the build cache
        # (mostly the standard library) is what's worth keeping.
        cache-dependency-path: go.mod

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

    - name: Build the WebAssembly module
      run: GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o /dev/null ./cmd/scrap-wasm
