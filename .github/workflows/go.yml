# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version-file: 'go.mod'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

    - name: Build the WebAssembly modules
      run: |
        GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o /dev/null ./cmd/scrap-wasm
        GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o /dev/null ./cmd/example/scrap-web
